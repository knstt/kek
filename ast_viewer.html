<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kek AST Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #1f2528;
      --muted: #687276;
      --line: #d8dddf;
      --accent: #0b7285;
      --token: #7c3aed;
      --shadow: 0 10px 30px rgba(20, 30, 35, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171a1c;
        --panel: #202528;
        --text: #f1f5f6;
        --muted: #a8b2b6;
        --line: #384247;
        --accent: #4dd0e1;
        --token: #c4a7ff;
        --shadow: none;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="file"] {
      max-width: 240px;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 10px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    main {
      padding: 20px;
    }

    #tree {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
      overflow: auto;
    }

    .empty {
      max-width: 760px;
      margin: 60px auto;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    details {
      margin-left: 18px;
      border-left: 1px solid var(--line);
      padding-left: 12px;
    }

    details:first-child {
      margin-left: 0;
      border-left: 0;
      padding-left: 0;
    }

    summary {
      cursor: pointer;
      padding: 5px 0;
      white-space: nowrap;
    }

    .node-type {
      font-weight: 700;
      color: var(--accent);
    }

    .token {
      color: var(--token);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-left: 8px;
    }

    .leaf {
      margin-left: 18px;
      padding: 4px 0 4px 12px;
      border-left: 1px solid var(--line);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kek AST Viewer</h1>
    <div class="controls">
      <input id="fileInput" type="file" accept=".json,application/json">
      <button id="expandAll" type="button">Expand</button>
      <button id="collapseAll" type="button">Collapse</button>
    </div>
  </header>
  <main>
    <div id="tree" class="empty">Load JSON created with: <code>./kek --ast-json tmp.kek ast.json</code></div>
  </main>
  <script>
    const tree = document.getElementById("tree");
    const fileInput = document.getElementById("fileInput");

    function text(value) {
      return document.createTextNode(value);
    }

    function meta(node) {
      return `line ${node.line}, col ${node.column}, off ${node.offset}, len ${node.length}`;
    }

    function renderNode(node) {
      const hasChildren = node.children && node.children.length > 0;
      const label = document.createElement("span");
      const type = document.createElement("span");
      type.className = "node-type";
      type.textContent = node.type;
      label.append(type);

      if (node.tokenType) {
        label.append(text(" "));
        const token = document.createElement("span");
        token.className = "token";
        token.textContent = `${node.tokenType} ${JSON.stringify(node.text)}`;
        label.append(token);
      }

      const location = document.createElement("span");
      location.className = "meta";
      location.textContent = meta(node);
      label.append(location);

      if (!hasChildren) {
        const leaf = document.createElement("div");
        leaf.className = "leaf";
        leaf.append(label);
        return leaf;
      }

      const details = document.createElement("details");
      details.open = true;
      const summary = document.createElement("summary");
      summary.append(label);
      details.append(summary);
      for (const child of node.children) {
        details.append(renderNode(child));
      }
      return details;
    }

    function renderAst(ast) {
      tree.className = "";
      tree.replaceChildren(renderNode(ast));
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const text = await file.text();
      renderAst(JSON.parse(text));
    });

    document.getElementById("expandAll").addEventListener("click", () => {
      tree.querySelectorAll("details").forEach((detail) => detail.open = true);
    });

    document.getElementById("collapseAll").addEventListener("click", () => {
      tree.querySelectorAll("details").forEach((detail) => detail.open = false);
    });
  </script>
</body>
</html>
